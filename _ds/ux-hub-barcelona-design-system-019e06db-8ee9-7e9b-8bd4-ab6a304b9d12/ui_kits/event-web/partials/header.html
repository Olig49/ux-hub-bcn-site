<!--
  Partial: Header / primary nav
  Extracted verbatim from: index.html, lines 32-71 (the sponsors.html header
  is the same pattern with root-relative link swaps — see README "Adapting"
  notes).

  Depends on:
    - styles/site.css      → .site-header, .nav-shell, .nav, .nav-brand,
                              .nav-logo, .nav-links, .nav-link, .nav-cta,
                              .nav-burger, .burger-bar, .mobile-drawer,
                              .mobile-drawer-inner, .drawer-cta, .skip,
                              .sr-only
    - styles/tokens.css    → color/spacing/font custom properties used above,
                              including --uxh-dur-nav (the nav's own open/
                              close duration — see "JS behavior" below)
    - html[data-accent="…"] on <html> (site.css L12-15) sets which brand
      color .nav-cta / .drawer-cta render in — default (no attribute) is
      Yolk. Set <html data-accent="yolk|purple|lime|teal"> on the page
      that hosts this partial.

  Structure — .nav-shell is the one rounded card, not .nav alone:
    .nav (the bar row, always visible) and .mobile-drawer (the ≤880px
    collapsible menu) are both children of .nav-shell, sharing one
    background/border/shadow. .mobile-drawer is `position: absolute`
    against .nav-shell (which needs `position: relative` for that to work)
    rather than laid out in flow inside it — opening it never changes the
    shell's own height or pushes page content below the header down; it
    floats over that content instead, matching background/border/radius so
    the two still read as one continuous shape with a zero-gap seam
    (.nav-shell's bottom corners flatten to 0 while
    `.nav-shell:has(.mobile-drawer.open)`, meeting .mobile-drawer's square
    top edge). The burger's icon is three `.burger-bar` spans, not an SVG —
    they rotate into an X via CSS driven directly off the button's own
    `aria-expanded` attribute, so the visual and accessible state can never
    disagree.

  JS behavior required (copy the "Mobile drawer" block from index.html's
  inline <script>, ~lines 610-648):
    - Mobile drawer open/close: toggles #mobile-drawer via #nav-burger,
      manages aria-expanded/aria-label, focus trap (Tab/Shift+Tab loop),
      Escape to close, outside-pointerdown to close, body scroll lock.
      Open/close is animated (grid-template-rows 0fr/1fr on .mobile-drawer,
      border-radius on .nav-shell) over `--uxh-dur-nav` (360ms) — the JS
      sequences `hidden`/`.open` around that with requestAnimationFrame on
      open and a matching setTimeout on close, same pattern as the event
      Modal (see overlay/README.md).
    - "Next event" button (#next-event-btn / #next-event-btn-mobile) opens
      a modal dialog (#event-modal) that is NOT part of this kit — either
      wire it to your own event modal, or repoint it to a plain link
      (e.g. a Meetup URL or "#events" anchor) if you don't build a modal.

  Adapting for a new event page:
    - Swap the logo asset/alt if using a different lockup.
    - Update nav-links hrefs/labels to your page's real section ids.
    - Point .nav-cta / .drawer-cta at whatever your primary action is
      (RSVP link, modal trigger, mailing list anchor, etc).
-->
<header class="site-header" data-comment-anchor="site-header">
  <div class="nav-shell">
    <nav class="nav" aria-label="Primary">
      <a href="#home" class="nav-brand" aria-label="UX Hub Barcelona, home">
        <img class="nav-logo" src="assets/logo-horizontal-seaturtle.svg" alt="UX Hub Barcelona" width="453" height="95" />
      </a>

      <div class="nav-links" id="nav-links">
        <a href="https://www.meetup.com/ux-hub-barcelona/events/" target="_blank" rel="noopener" class="nav-link">Events<span class="sr-only"> (opens in a new tab)</span><svg class="ext" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg></a>
        <a href="#partners" class="nav-link">For partners</a>
        <a href="#donate" class="nav-link">Donate</a>
        <a href="#join" class="nav-link">Mailing list</a>
      </div>

      <button type="button" class="nav-cta" id="next-event-btn" aria-haspopup="dialog" aria-controls="event-modal">
        Next event
        <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>

      <button type="button" class="nav-burger" id="nav-burger" aria-label="Open menu" aria-controls="mobile-drawer" aria-expanded="false">
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
      </button>
    </nav>

    <div class="mobile-drawer" id="mobile-drawer" hidden>
      <div class="mobile-drawer-inner">
        <a href="https://www.meetup.com/ux-hub-barcelona/events/" target="_blank" rel="noopener">Events</a>
        <a href="#partners">For partners</a>
        <a href="#donate">Donate</a>
        <a href="#join">Mailing list</a>
        <button type="button" id="next-event-btn-mobile" class="drawer-cta">
          Next event
          <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>
