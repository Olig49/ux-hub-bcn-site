name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the actual site is published — _handoff/ (chat transcripts, the
      # original Claude Design handoff docs) and scripts/ (CI-only) stay out
      # of the public deployment even though they stay in the repo.
      - name: Build publish directory
        run: |
          mkdir _site
          cp -r index.html sponsors.html styles assets data _ds CNAME _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
